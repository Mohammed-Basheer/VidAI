services:
  - type: web
    name: vidai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run app.py --host 0.0.0.0 --port $PORT -h
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PGVECTOR_URL
        sync: false
